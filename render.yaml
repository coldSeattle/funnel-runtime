services:
  - type: web
    name: funnel-runtime
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: SEED_ON_BOOT
        value: "1"
      - key: DATA_DIR
        value: /app/data
      - key: NODE_ENV
        value: production
